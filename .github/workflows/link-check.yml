name: Link check

# This page is the org's front door for students; its links (book editions,
# CRAN/PyPI pages, GitHub repos) rot independently of pushes here, so the
# weekly cron is the point.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check links in index.html
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept "200,204,206,301,302,308,403,429" index.html
          fail: true
